name: Publish master build to TestPyPI

on:
  push:
    tags:
      - 'v*-test'

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Publish master-built wheels to TestPyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Find successful master wheel build for this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          run_id="$(gh run list \
            --repo "$REPOSITORY" \
            --workflow test-pypi.yml \
            --commit "$COMMIT_SHA" \
            --limit 100 \
            --json databaseId,event,conclusion,headBranch \
            --jq '[.[] | select(.event == "push" and .conclusion == "success" and .headBranch == "master")][0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No successful test-pypi.yml master build found for commit $COMMIT_SHA." >&2
            echo "Push the commit to master and wait for its build to finish before tagging it." >&2
            exit 1
          fi
          echo "Using successful master build run $run_id for $COMMIT_SHA."
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download wheels from the master build
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run-id }}
          pattern: testpypi-wheelhouse-*
          merge-multiple: true
          path: wheelhouse

      - name: Verify HDF5 redistribution notices in wheels
        run: python scripts/check_hdf5_wheel_licenses.py wheelhouse

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/*.whl
