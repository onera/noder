name: Build and Test

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build ${{ matrix.cibw_build }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      SETUPTOOLS_SCM_OVERRIDES_FOR_NODER: '{local_scheme = "no-local-version"}'
    strategy:
      # A failing wheel build must not cancel the other OS/Python legs.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibuildwheel_version: "4.0.0"
            cibw_build: "cp314-*"
          - os: windows-latest
            cibuildwheel_version: "4.0.0"
            cibw_build: "cp314-*"
          - os: macos-latest
            cibuildwheel_version: "4.0.0"
            cibw_build: "cp314-*"
          - os: ubuntu-latest
            cibuildwheel_version: "3.4.1"
            cibw_build: "cp38-*"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" # Used for bootstrapping cibuildwheel

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==${{ matrix.cibuildwheel_version }} delocate auditwheel delvewheel build numpy scikit-build-core pybind11 twine

 
      - name: Configure pkg-config path (Linux)
        if: runner.os == 'Linux'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV    

      - name: Configure pkg-config path (macOS)
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install HDF5 via Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5 pkg-config

      - name: Setup HDF5 for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/setup_hdf5_windows.ps1

      - name: Build wheels (Linux and macOS)
        if: runner.os != 'Windows'
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: "*-manylinux_i686 *-musllinux* *-win32 *-pp*"
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.ENABLE_CGNSVI=ON
            cmake.define.ENABLE_MPI=OFF
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y epel-release &&
            yum install -y hdf5-devel pkgconfig &&
            find /usr -name hdf5.h &&
            find /usr -name libhdf5.so
          CIBW_ENVIRONMENT_LINUX: >
            NODER_EXPECT_CGNSVI=1
            CMAKE_PREFIX_PATH="/usr"
            CMAKE_INCLUDE_PATH="/usr/include"
            CMAKE_LIBRARY_PATH="/usr/lib64"
          CIBW_ENVIRONMENT_MACOS: >
            NODER_EXPECT_CGNSVI=1
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_OSX_DEPLOYMENT_TARGET=14.0
          CIBW_ENVIRONMENT_WINDOWS: >
            NODER_EXPECT_CGNSVI=1
            HDF5_C_LIBRARY=%HDF5_C_LIBRARY%
            HDF5_INCLUDE_DIR=%HDF5_INCLUDE_DIR%
            HDF5_DIR=%HDF5_DIR%
            CMAKE_PREFIX_PATH=%HDF5_ROOT%
            CMAKE_INCLUDE_PATH=%HDF5_INCLUDE_DIR%
            CMAKE_LIBRARY_PATH=%HDF5_ROOT%\lib
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            bash scripts/repair_macos_wheel.sh {wheel} {dest_dir}
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir} {wheel}

        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Build wheels (Windows with MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: "*-manylinux_i686 *-musllinux* *-win32 *-pp*"
          CIBW_CONFIG_SETTINGS_WINDOWS: >-
            cmake.define.ENABLE_CGNSVI=ON
            cmake.define.ENABLE_MPI=OFF
          CIBW_ENVIRONMENT_WINDOWS: >-
            NODER_EXPECT_CGNSVI=1
            HDF5_C_LIBRARY=%HDF5_C_LIBRARY%
            HDF5_INCLUDE_DIR=%HDF5_INCLUDE_DIR%
            HDF5_DIR=%HDF5_DIR%
            CMAKE_PREFIX_PATH=%HDF5_ROOT%
            CMAKE_INCLUDE_PATH=%HDF5_INCLUDE_DIR%
            CMAKE_LIBRARY_PATH=%HDF5_ROOT%\lib
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify HDF5 redistribution notices in wheels
        run: python scripts/check_hdf5_wheel_licenses.py wheelhouse

      - name: Save wheels for TestPyPI deployment
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-wheelhouse-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1
